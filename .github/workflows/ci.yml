name: Validate and stage
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm security
      - run: pnpm audit --prod --audit-level high
      - run: pnpm eval
      - run: pnpm build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m py_compile connectors/opencti/connector.py infra/opencti/update.py infra/opencti/monitoring.py infra/opencti/host-health.py
      - run: python -m unittest discover -s tests/opencti -v
      - run: pnpm bootstrap
      - run: python -m pip install stix2==3.0.2
      - name: Validate STIX interoperability
        run: python -c "import json, stix2; [stix2.parse(json.load(open(path)), allow_custom=True) for path in ['artifacts/demo.stix.json', 'artifacts/enterprise-stix.json']]"
      - run: pnpm exec e2e-web install chromium --with-deps
      - name: Existing browser regressions
        run: pnpm test:playwright
      - name: Isolated full-stack end-to-end suite
        run: pnpm test:e2e
      - name: Publish end-to-end diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/artifacts/
            .e2e/failures/
            .e2e/logs/
            artifacts/playwright/
            !.e2e/runtime/**
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: artifacts/evaluation.json
  staging:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          THREATSIEVE_D1_ID: ${{ vars.THREATSIEVE_D1_ID }}
          THREATSIEVE_WEB_ORIGIN: ${{ vars.THREATSIEVE_WEB_ORIGIN }}
          THREATSIEVE_API_ORIGIN: ${{ vars.THREATSIEVE_API_ORIGIN }}
